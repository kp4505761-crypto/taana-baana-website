<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taana Baana — Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --maroon:#4A0E1F; --ivory:#F4EDE0; --gold:#C09A45; --ink:#2C0912; --marigold:#D9722C; }
  *{box-sizing:border-box;}
  body{font-family:'Jost',sans-serif; background:var(--ivory); color:var(--ink); margin:0; padding:40px 24px;}
  h1{font-family:'Marcellus',serif; font-weight:400; margin-bottom:4px;}
  .sub{color:#8a6b5a; font-size:0.9rem; margin-bottom:30px;}
  #gate{max-width:360px; margin:80px auto; text-align:center;}
  #gate input{width:100%; padding:12px 14px; border:1px solid rgba(74,14,31,0.25); border-radius:4px; margin:14px 0; font-family:inherit;}
  #gate button{width:100%; padding:12px; background:var(--maroon); color:#fff; border:none; border-radius:4px; font-family:inherit; cursor:pointer;}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:6px; overflow:hidden; box-shadow:0 10px 30px rgba(44,9,18,0.08);}
  th,td{text-align:left; padding:14px 16px; font-size:0.85rem; border-bottom:1px solid rgba(74,14,31,0.08); vertical-align:top;}
  th{background:var(--maroon); color:var(--ivory); font-weight:400; letter-spacing:0.04em; text-transform:uppercase; font-size:0.72rem;}
  tr:last-child td{border-bottom:none;}
  .items{font-size:0.78rem; color:#6b5347;}
  select{padding:6px 8px; border-radius:4px; border:1px solid rgba(74,14,31,0.25); font-family:inherit;}
  .status-new{color:var(--marigold); font-weight:600;}
  .empty{text-align:center; padding:60px; color:#8a6b5a;}
  .amt{font-family:'Marcellus',serif;}
</style>
</head>
<body>

<div id="gate">
  <h1>Orders</h1>
  <p class="sub">Enter your admin key to view order requests.</p>
  <input type="password" id="adminKeyInput" placeholder="Admin key">
  <button id="unlockBtn">View orders</button>
</div>

<div id="dashboard" style="display:none; max-width:1100px; margin:0 auto;">
  <h1>Order requests</h1>
  <p class="sub" id="countSub"></p>
  <table id="ordersTable">
    <thead>
      <tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>
</div>

<script>
  let adminKey = "";

  document.getElementById("unlockBtn").addEventListener("click", loadOrders);
  document.getElementById("adminKeyInput").addEventListener("keydown", e => { if(e.key === "Enter") loadOrders(); });

  async function loadOrders(){
    adminKey = document.getElementById("adminKeyInput").value.trim();
    if(!adminKey){ alert("Enter your admin key"); return; }

    const res = await fetch("/api/orders", { headers: { "x-admin-key": adminKey } });
    if(res.status === 401){ alert("Wrong admin key"); return; }
    const data = await res.json();

    document.getElementById("gate").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    renderOrders(data.orders);
  }

  function fmt(n){ return "₹" + Number(n).toLocaleString("en-IN"); }

  function renderOrders(orders){
    document.getElementById("countSub").textContent = `${orders.length} request${orders.length!==1?"s":""} total`;
    const body = document.getElementById("ordersBody");

    if(orders.length === 0){
      body.innerHTML = `<tr><td colspan="5" class="empty">No order requests yet.</td></tr>`;
      return;
    }

    body.innerHTML = orders.map(o => `
      <tr>
        <td>
          <strong>${o.orderId}</strong><br>
          <span class="items">${new Date(o.createdAt).toLocaleString("en-IN")}</span>
        </td>
        <td>
          ${o.name}<br>
          <span class="items">${o.phone}<br>${o.address}, ${o.city}</span>
          ${o.note ? `<br><span class="items">Note: ${o.note}</span>` : ""}
        </td>
        <td class="items">
          ${o.items.map(i => `${i.qty} × ${i.name}`).join("<br>")}
        </td>
        <td class="amt">${fmt(o.total)}</td>
        <td>
          <select data-id="${o.orderId}" class="${o.status === 'new' ? 'status-new' : ''}">
            ${["new","called","confirmed","delivered","cancelled"].map(s =>
              `<option value="${s}" ${s===o.status?"selected":""}>${s}</option>`
            ).join("")}
          </select>
        </td>
      </tr>
    `).join("");

    body.querySelectorAll("select").forEach(sel => {
      sel.addEventListener("change", async () => {
        await fetch(`/api/orders/${sel.dataset.id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
          body: JSON.stringify({ status: sel.value })
        });
        sel.className = sel.value === "new" ? "status-new" : "";
      });
    });
  }
</script>
</body>
</html>
